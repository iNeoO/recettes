# Sert la SPA et renvoie /api vers le conteneur de l'API, comme le proxy Vite
# en développement : même origine, donc le cookie de session part tout seul.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Prometheus lit /metrics par le réseau interne, jamais par ici.
    location = /api/metrics {
        return 404;
    }

    # Le préfixe /api tombe : /api/recipes/42 devient /recipes/42 côté API.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }

    # Le bundle est haché : il ne change jamais sous le même nom.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Tout le reste est une route du routeur côté client.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
