services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recettes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?renseigner .env}
      POSTGRES_DB: ${POSTGRES_DB:-recettes}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recettes}"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Garage : stockage objet compatible S3, pour les photos des recettes.
  garage:
    image: dxflrs/garage:v1.0.1
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?renseigner .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?renseigner .env}
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"
      - "${GARAGE_ADMIN_PORT:-3903}:3903"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

volumes:
  postgres-data:
  garage-meta:
  garage-data:
